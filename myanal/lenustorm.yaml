#
# -Configuration file for FLUKA Simulation
#
# Units in:  m s

trg_to_lblnd    : 310 # = 250+60 in Nicks last drawing he claims 338 m from the decay tunnel start to ND front face
ss_to_lemond    : 50
l_decay_tunnel  : 60
w_decay_tunnel  : 15  # = 2*7.5
r_decay_pipe    : 2.5
h_decay_tunnel  : 13  # = 2*6.5
w_ring_tunnel   : 2
h_ring_tunnel   : 4
ring_walls      : 2
w_tline_tunnel  : 4
h_tline_tunnel  : 4
mparking_start  : [0, 0, -101]  # x,z coordinates 
mparking_radius : 10

trg_to_d1pivot  : 2.5          # from targed front to D1 pivot point
d2pivot_to_inj  : [-2, 6.0]    # D2 pivot to LEnuSTORM injection point in (xz) coordinates 
tlend_to_inj    : [-2, 6.0]    # TL end (end of D2 dipole) to LEnuSTORM injection point in (xz) coordinates 
ring_inj_x      : -11.5
ring_inj_z      : 24.45

beam_size  : 0.10   # +10 cm beam size
qaperture_x : 0.15  # 30cm diameter 
qaperture_y : 0.15ß

t2r: # T2R line specific
  # l_bend      : 2.0     # arc length of the dipoles
  l_bend_end  : 0.35
  l_bend_woke : 0.50

  # l_quad      : 0.80
  l_quad_end  : 0.20
  l_quad_w    : .60
  l_quad_h    : .60
  # l_qfl       : 0.80
  l_qfl_end   : 0.20
  l_qfl_w     : .90
  l_qfl_h     : .90
  l_vac       : 0.10

 